[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zevampy"
version = "2.0.0"
authors = [
  { name="Gabriel Möring-Martínez", email="gabriel.moeringmartinez@dlr.de" },
]
description = "ZEVAMPY: A Python framework for vehicle stock turnover and powertrain adoption modelling"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]

classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

requires-python = ">=3.12"

dependencies = [
    "pandas>=2.3",
    "scipy>=1.15",
    "matplotlib>=3.10",
    "PyYAML>=6.0",
]


keywords = [
    "vehicle-stock-model",
    "electric-vehicles",
    "transport-model",
    "survival-analysis",
    "fleet-modelling",
    "energy-transition",
]

[project.urls]
Homepage = "https://github.com/gabrielmoringmartinez/zevampy"
Issues = "https://github.com/gabrielmoringmartinez/zevampy/issues"
Repository = "https://github.com/gabrielmoringmartinez/zevampy.git"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
zevampy = "zevampy.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--cov=zevampy",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["zevampy"]

[tool.coverage.report]
show_missing = true